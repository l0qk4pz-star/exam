<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶蛙换装游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  html, body { height: 100%; overflow: hidden; background-color: #f0f0f0; }
  #app { width: 100%; height: 100%; position: relative; }

  /* 背景通用样式 */
  .page {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
  }
  .hidden { display: none !important; opacity: 0; }

  /* 背景虚化效果 */
  .blurred {
    filter: blur(10px);
    transition: filter 0.3s;
  }

  /* 首页背景 (1.png) */
  #home { background-image: url('1.png'); }
  /* 选择页背景 (2.png) */
  #selection { background-image: url('2.png'); }
  /* 换装展示页背景，沿用 2.png 的颜色风格 */
  #display { background-color: #fff; }

  /* 标题 */
  .title {
    font-size: 36px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,0,0.8);
    margin-bottom: 30px;
    z-index: 2;
  }

  /* 通用按钮样式 */
  .btn {
    padding: 14px 50px;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ffb347, #ff7b00);
    border: none;
    border-radius: 50px;
    box-shadow: 0 6px 0 #b35200, 0 10px 20px rgba(0,0,0,0.2);
    cursor: pointer;
    z-index: 2;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #b35200, 0 4px 10px rgba(0,0,0,0.2);
  }

  /* 命名弹窗 */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-content {
    background: #fff;
    padding: 30px 24px;
    border-radius: 24px;
    width: 80%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: popIn 0.3s ease-out;
  }
  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal-content h3 { margin-bottom: 20px; color: #333; font-size: 20px; }
  .modal-content input {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
    outline: none;
  }
  .modal-content input:focus { border-color: #ffb347; }
  .modal-content .btn { width: 100%; padding: 12px 0; font-size: 18px; box-shadow: 0 4px 0 #b35200; }

  /* 玩家名字显示 */
  .player-name {
    position: absolute;
    top: 40px;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    z-index: 2;
    background: rgba(0,0,0,0.3);
    padding: 6px 20px;
    border-radius: 20px;
  }

  /* 四个按钮区域（网格布局） */
  .clothes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 80%;
    max-width: 320px;
    position: absolute;
    bottom: 80px;
    z-index: 2;
  }
  .clothes-btn {
    padding: 16px 0;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    border: none;
    border-radius: 16px;
    box-shadow: 0 4px 0 #cc7a7e, 0 8px 15px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .clothes-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #cc7a7e, 0 4px 8px rgba(0,0,0,0.15);
  }
  /* 不同按钮不同颜色 */
  .clothes-btn[data-outfit="guerrilla"] { background: linear-gradient(135deg, #a8e063, #56ab2f); box-shadow: 0 4px 0 #3d7a20; }
  .clothes-btn[data-outfit="school"] { background: linear-gradient(135deg, #4facfe, #00f2fe); box-shadow: 0 4px 0 #1976d2; }
  .clothes-btn[data-outfit="qipao"] { background: linear-gradient(135deg, #f093fb, #f5576c); box-shadow: 0 4px 0 #b33947; }
  .clothes-btn[data-outfit="dress"] { background: linear-gradient(135deg, #ffecd2, #fcb69f); box-shadow: 0 4px 0 #d99a84; color: #7a3d2e; }

  /* 换装展示页 */
  #outfitImage {
    width: 90%;
    height: 90%;
    object-fit: contain;
    z-index: 1;
  }
  /* 返回按钮 */
  .back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 44px;
    height: 44px;
    background: rgba(0,0,0,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
    cursor: pointer;
    z-index: 20;
    backdrop-filter: blur(4px);
  }
  .back-btn:active { background: rgba(0,0,0,0.6); }

</style>
</head>
<body>

<div id="app">
  <!-- 首页 -->
  <div id="home" class="page">
    <div class="title">奶蛙换装游戏</div>
    <button class="btn" id="startBtn">开始</button>
  </div>

  <!-- 命名弹窗 -->
  <div id="namingModal"
